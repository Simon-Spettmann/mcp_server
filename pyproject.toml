[tool.poetry]
name = "nextcloud_mcp_server"
description = "Nextcloud MCP Server - Exposes Nextcloud capabilities as MCP tools"
authors = ["Nextcloud GmbH and contributors"]
license = "AGPL-3.0-or-later"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4"
nc-py-api = {extras = ["calendar"], version = "^0.24.2"}
fastmcp = "^2.14"
uvicorn = "^0.40"
requests = "^2.31.0"
niquests = "^3.17.0"
ics = "^0.7.2"
pytz = "^2025.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["A", "B", "C", "D", "E", "F", "G", "I", "S", "SIM", "PIE", "Q", "RET", "RUF", "UP", "W"]
extend-ignore = ["D101", "D102", "D103", "D105", "D107", "D203", "D213", "D401", "I001", "RUF100", "D400", "D415"]

[tool.isort]
profile = "black"
